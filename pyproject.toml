[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patrick"
version = "0.1.0"
description = "A local-first PHP security scanner with distinct CLI scan modes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Project contributors" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[project.scripts]
patrick = "patrick.cli:main"
patrick-web = "patrick.web_ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patrick = ["rules/*.json", "web/*.html", "web/*.css", "web/*.js"]
